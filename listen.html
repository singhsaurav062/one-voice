<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5f0"><title>A voice note, just for you — Once</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><header class="topbar"><a class="wordmark" href="/" aria-label="Once home"><span class="mark">◉</span> once<span class="period">.</span></a><span class="top-note">A little privacy, by design</span><span class="top-index">JUST FOR YOU</span></header>
<main class="shell listen-shell"><section class="listen-card"><div class="eyebrow"><span class="live-dot"></span> A NOTE LEFT FOR YOU</div><div class="listen-art"><div class="big-orbit"><span class="sound-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div><span class="orbit-caption">ONE LISTEN ONLY</span></div><h1 id="listenTitle">A voice,<br><em>just once.</em></h1><p class="lede" id="listenCopy">This message disappears after you listen. Find a quiet moment, then press play.</p><button class="button button-primary play-button" id="playButton" type="button"><span class="play-triangle"></span><span>Listen now</span></button><div class="listen-status" id="listenStatus" role="status" aria-live="polite"></div><audio id="messageAudio" class="hidden"></audio><a class="back-link" href="/">Make a note of your own ↗</a></section><footer class="footnote"><span>NO ACCOUNTS. NO REPLAYS.</span><span>MADE TO DISAPPEAR&nbsp; ✳</span></footer></main><script>
const id = location.pathname.split('/').pop();
const button = document.getElementById('playButton'), title = document.getElementById('listenTitle'), copy = document.getElementById('listenCopy'), status = document.getElementById('listenStatus'), audio = document.getElementById('messageAudio');
const unavailable = () => { button.disabled = true; button.classList.add('hidden'); title.innerHTML = 'Gone after<br><em>one listen.</em>'; copy.textContent = 'This voice note has already been heard or the link is no longer available.'; };
fetch(`/api/messages/${id}`).then(r => { if (!r.ok) throw new Error(); }).catch(unavailable);
button.addEventListener('click', async () => { button.disabled = true; button.innerHTML = '<span class="spinner"></span><span>Opening your message…</span>'; status.textContent = '';
 try { const response = await fetch(`/api/messages/${id}/claim`, { method: 'POST' }); if (!response.ok) throw new Error('This message has already been listened to or is unavailable.'); const blob = await response.blob(); audio.src = URL.createObjectURL(blob); title.innerHTML = 'A moment,<br><em>all yours.</em>'; copy.textContent = 'Press play when you’re ready. This message won’t be available again.'; button.innerHTML = '<span class="play-triangle"></span><span>Play message</span>'; button.disabled = false; status.textContent = 'Your message is ready.'; audio.addEventListener('ended', () => { audio.pause(); const oldUrl = audio.src; audio.removeAttribute('src'); URL.revokeObjectURL(oldUrl); audio.classList.add('hidden'); button.classList.add('hidden'); title.innerHTML = 'Gone after<br><em>one listen.</em>'; copy.textContent = 'This note has disappeared. Keep the feeling, let go of the audio.'; status.textContent = 'This message can’t be played again.'; }, { once: true }); button.onclick = async () => { button.disabled = true; try { await audio.play(); button.classList.add('hidden'); audio.classList.remove('hidden'); status.textContent = 'Your one listen has begun.'; } catch { button.disabled = false; status.textContent = 'Tap play again when you’re ready.'; } }; }
 catch (e) { unavailable(); status.textContent = e.message || 'This message can’t be opened.'; }
});
</script></body></html>
